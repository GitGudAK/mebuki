# Builds the iOS app with current Xcode on GitHub's macOS runners and uploads it
# to App Store Connect (TestFlight). Signing is cloud-managed through an
# App Store Connect API key, so no certificates or profiles live in the repo.
#
# Required repository secrets:
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   Issuer ID shown above the keys list
#   ASC_KEY_P8      Contents of the downloaded AuthKey_<id>.p8 file
#
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0.

name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Build numbers must increase on every upload; the run number always does.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build web app and sync into the iOS project
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ]; then
            echo "::error::Missing ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 repository secrets."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # One long-lived Apple Distribution certificate and App Store profile, kept in secrets,
      # so CI never asks Apple for a new certificate (the account caps how many it can hold).
      - name: Install signing certificate and profile
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          DIST_PROFILE: ${{ secrets.DIST_PROFILE }}
        run: |
          if [ -z "$DIST_CERT_P12" ] || [ -z "$DIST_PROFILE" ]; then
            echo "::error::Missing DIST_CERT_P12 / DIST_CERT_PASSWORD / DIST_PROFILE repository secrets."
            exit 1
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            printf '%s' "$DIST_PROFILE" | base64 --decode > "$dir/mebuki-app-store.mobileprovision"
          done
          security find-identity -v -p codesigning "$KC"

      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Mebuki.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to App Store Connect
        working-directory: ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mebuki.xcarchive" \
            -exportOptionsPlist ../ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Remove API key and signing keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Keep build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: ~/Library/Logs/DiagnosticReports
          if-no-files-found: ignore
